name: iOS Architecture Proof

on:
  push:
  workflow_dispatch:

jobs:
  proof:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 1. Xcode version
        run: |
          mkdir -p proof
          xcodebuild -version | tee proof/01_xcode_version.txt
          sw_vers | tee -a proof/01_xcode_version.txt

      - name: 2. Generate Xcode project (PrivacyLensIOS + PrivacyLensTunnel)
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -list -project PrivacyLensIOS.xcodeproj | tee proof/02_targets_and_schemes.txt
          find . -path ./.git -prune -o -path ./build -prune -o -path ./proof -prune -o -type f -print | sort | tee proof/03_project_structure.txt

      - name: 3. Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in d.items():
              if 'iOS' in rt:
                  for x in devs:
                      if x['name'].startswith('iPhone'):
                          print(x['udid']); sys.exit()
          ")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl list devices available | grep "$UDID" | tee proof/04_simulator.txt

      - name: 4. Build app + Packet Tunnel extension for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project PrivacyLensIOS.xcodeproj \
            -scheme PrivacyLensIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee proof/05_build_log.txt
          echo "---- Built products ----" | tee proof/06_built_products.txt
          find build/Build/Products -maxdepth 4 \( -name "*.app" -o -name "*.appex" \) | tee -a proof/06_built_products.txt

      - name: 4b. Zip simulator .app bundle
        run: |
          mkdir -p sim-app
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/PrivacyLensIOS.app \
            sim-app/PrivacyLens-simulator.zip
          ls -la sim-app

      - name: Upload simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyLens-simulator
          path: sim-app/PrivacyLens-simulator.zip
          if-no-files-found: error

      - name: 4c. Upload simulator .app to Appetize.io
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "::warning::APPETIZE_API_TOKEN secret is not set; skipping Appetize upload."
            exit 0
          fi
          # Re-use the same Appetize app (same link) when APPETIZE_PUBLIC_KEY is set.
          URL=https://api.appetize.io/v1/apps
          [ -n "$APPETIZE_PUBLIC_KEY" ] && URL="$URL/$APPETIZE_PUBLIC_KEY"
          CODE=$(curl -sS -o appetize.json -w "%{http_code}" "$URL" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@sim-app/PrivacyLens-simulator.zip" \
            -F "platform=ios")
          cat appetize.json; echo
          [ "$CODE" = "200" ] || { echo "::error::Appetize upload failed (HTTP $CODE)"; exit 1; }
          KEY=$(python3 -c "import json;print(json.load(open('appetize.json'))['publicKey'])")
          echo "Appetize link: https://appetize.io/app/$KEY" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 5. Unit tests for tracker classification logic
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project PrivacyLensIOS.xcodeproj \
            -scheme PrivacyLensCoreTests \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee proof/07_unit_tests.txt

      - name: 6. Run app in simulator and take screenshot
        continue-on-error: true
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=build/Build/Products/Debug-iphonesimulator/PrivacyLensIOS.app
          xcrun simctl install "$UDID" "$APP" 2>&1 | tee proof/08_run_log.txt
          xcrun simctl launch "$UDID" com.thecyberlayer.PrivacyLensIOS 2>&1 | tee -a proof/08_run_log.txt
          sleep 10
          mkdir -p launch-screenshot
          xcrun simctl io booted screenshot launch-screenshot/ios-launch-screenshot.png
          cp launch-screenshot/ios-launch-screenshot.png proof/09_simulator_screenshot.png
          xcrun simctl spawn "$UDID" log show --last 2m --style compact \
            --predicate 'eventMessage CONTAINS "PRIVACYLENS_PROBE" OR subsystem CONTAINS "networkextension" OR process == "nehelper" OR process == "nesessionmanager"' \
            2>&1 | tail -80 | tee proof/10_network_extension_log.txt

      - name: Upload launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-screenshot
          path: launch-screenshot/ios-launch-screenshot.png
          if-no-files-found: error

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacylens-ios-proof
          path: proof/
