name: Publish Proof

on:
  workflow_run:
    workflows: ["iOS Architecture Proof"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of iOS Architecture Proof"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: privacylens-ios-proof
          path: proof
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push proof files to proof-output branch
        run: |
          cd proof
          git init -b proof-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -m "Proof output [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" proof-output
