name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create Xcode project structure
        run: |
          mkdir -p PrivacyLensIOS
          echo "placeholder" > PrivacyLensIOS/README.txt

      - name: List simulators
        run: xcrun simctl list devices available

      - name: Boot simulator
        run: |
          xcrun simctl boot "iPhone 15" || true
          sleep 5

      - name: Simulator screenshot
        run: |
          mkdir -p artifacts
          xcrun simctl io booted screenshot artifacts/simulator.png || echo "screenshot failed" > artifacts/simulator.png

      - uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: artifacts/
