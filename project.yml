name: PrivacyLensIOS
options:
  bundleIdPrefix: com.thecyberlayer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PrivacyLensIOS:
    type: application
    platform: iOS
    sources: [PrivacyLensIOS]
    info:
      path: PrivacyLensIOS/Info.plist
      properties:
        CFBundleDisplayName: PrivacyLens
        UILaunchScreen: {}
    entitlements:
      path: PrivacyLensIOS/PrivacyLensIOS.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thecyberlayer.PrivacyLensIOS
    dependencies:
      - target: PrivacyLensTunnel
        embed: true
  PrivacyLensTunnel:
    type: app-extension
    platform: iOS
    sources: [PrivacyLensTunnel]
    info:
      path: PrivacyLensTunnel/Info.plist
      properties:
        CFBundleDisplayName: PrivacyLensTunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PrivacyLensTunnel/PrivacyLensTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thecyberlayer.PrivacyLensIOS.PrivacyLensTunnel
  PrivacyLensCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - PrivacyLensTunnel/TrackerClassifier.swift
      - PrivacyLensTunnel/DomainExtractor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thecyberlayer.PrivacyLensCoreTests
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  PrivacyLensIOS:
    build:
      targets:
        PrivacyLensIOS: all
        PrivacyLensTunnel: all
    run:
      config: Debug
  PrivacyLensTunnel:
    build:
      targets:
        PrivacyLensTunnel: all
  PrivacyLensCoreTests:
    build:
      targets:
        PrivacyLensCoreTests: [test]
    test:
      targets: [PrivacyLensCoreTests]
